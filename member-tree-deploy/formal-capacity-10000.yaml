# Existing formal resources only. Keep DB credentials, env vars, storage and data.
services:
  - type: web
    name: member-tree-dashboard-demo
    runtime: python
    plan: 1c-2g
    region: singapore
    repo: https://github.com/yanpaji-sudo/realtime-chat
    branch: member-tree-render
    buildCommand: base64 -d member-tree-deploy/payload.b64 | tar xz && pip install -r member-tree/requirements.txt
    startCommand: cd member-tree && uvicorn app:app --host 0.0.0.0 --port $PORT
databases:
  - name: member-tree-demo-db
    plan: 0.5c-1g
    region: singapore
