<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>磐石甄选中秋国庆七天乐</title><style>*{box-sizing:border-box}body{margin:0;background:#61030b;color:#fff4b0;font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(100%,560px);margin:auto;padding:8px 10px 90px}.hero,.card,.tile,.drawbox{border:1px solid #f5d66a;box-shadow:0 0 0 2px #9d350d inset,0 0 12px #0005;border-radius:14px}.hero{height:112px;text-align:center;padding:18px 8px;background:linear-gradient(135deg,#c91022,#8d0010 60%,#c30b1e);position:relative;overflow:hidden}.hero:before{content:'★';position:absolute;left:12px;top:18px;font-size:22px}.hero small{display:block;font-size:10px;letter-spacing:3px}.hero h1{font-family:serif;font-size:31px;margin:10px 0 5px;text-shadow:0 2px 4px #4b0000}.hero span{font-size:10px;letter-spacing:2px}.card{background:linear-gradient(180deg,#a60616,#76030d);padding:10px 12px;margin-top:8px}.redeem{display:flex;gap:6px}.redeem input{flex:1;background:#6e020a;border:1px solid #f0cf62;color:#fff;padding:11px;border-radius:8px}.btn{border:1px solid #fff0a0;background:linear-gradient(#fff0a0,#e8b72e);color:#72100b;font-weight:bold;border-radius:9px;padding:0 18px}.userbar{display:flex;justify-content:space-between;align-items:center;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat b{display:block;font-size:25px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.tile{min-height:112px;background:linear-gradient(#fff4bd,#f0d878);color:#8a100c;text-align:center;padding:7px 3px;display:flex;flex-direction:column;justify-content:center;align-items:center}.tile img{width:70px;height:62px;object-fit:contain;filter:drop-shadow(0 3px 4px #7c390055)}.tile .emoji{font-size:48px;height:62px;display:flex;align-items:center}.tile b{font-size:11px;line-height:15px}.tile small{font-size:8px}.drawbox{grid-column:2;grid-row:2 / span 2;min-height:229px;background:radial-gradient(circle,#ffad18,#bd1a0a 55%,#72030b);display:flex;flex-direction:column;justify-content:center;align-items:center}.logo{font-size:86px;font-weight:900;font-family:serif;font-style:italic;color:#ffe58a;text-shadow:3px 3px #7b2607,-2px -2px #fff4c0}.drawbtn{background:linear-gradient(#fff0a0,#e7b42b);color:#741009;border:2px solid #fff3ae;border-radius:28px;padding:12px 35px;font-size:18px;font-weight:bold;cursor:pointer}.drawbtn:disabled{opacity:.55}.note{text-align:center;font-size:9px;margin:5px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:flex;background:#65030c;border-top:1px solid #e9c752;padding:7px}.bottom button{flex:1;background:none;border:0;color:#ffe99a;padding:9px}.bottom .active{background:#f2ca49;color:#75100b;border-radius:9px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:25px}.modal.on{display:flex}.pop{width:min(90%,360px);background:linear-gradient(#bd0718,#68030b);border:2px solid #f6d866;border-radius:18px;text-align:center;padding:25px;box-shadow:0 15px 50px #000}.pop img{width:130px;height:110px;object-fit:contain}.pop .emoji{font-size:90px}.pop h2{margin:10px}.loading{animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.08);opacity:.65}}@media(max-width:390px){.hero h1{font-size:27px}.tile{min-height:104px}.tile img{width:62px}}
</style></head><body><main class="page"><section class="hero"><small>盛世华诞 · 好运同行</small><h1>磐石甄选中秋国庆七天乐</h1><span>NATIONAL DAY · LUCKY DRAW</span></section><section class="card"><div style="font-size:11px;margin-bottom:7px">抽奖码兑换 <span style="float:right">可用 <b id="draws">0</b> 次</span></div><div class="redeem"><input id="code" placeholder="请输入抽奖码"><button class="btn" onclick="redeem()">激活</button></div></section><section class="grid" id="grid"></section><div class="note">登录后点击中央按钮抽奖 · 每次消耗1次机会</div><section class="card stats"><div>当前用户<b id="uname">-</b></div><div>累计抽奖<b id="total">0</b></div></section></main><nav class="bottom"><button class="active" onclick="location.href='/'">🎁 幸运抽奖</button><button onclick="location.href='/profile.html'">♙ 个人中心</button></nav><div class="modal" id="login"><div class="pop"><h2>进入活动</h2><input id="username" placeholder="请输入用户名" style="width:100%;padding:12px;border-radius:8px;border:1px solid #e8ca62"><br><button class="drawbtn" style="margin-top:15px" onclick="login()">开始抽奖</button></div></div><div class="modal" id="result"><div class="pop"><div id="rimg"></div><h2 id="rname">恭喜中奖</h2><p id="rsub"></p><button class="drawbtn" onclick="closeResult()">收下奖励</button></div></div><script>let user=localStorage.getItem('ps_user');let prizes=[];const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}async function init(){const c=await api('/api/config');prizes=c.prizes;render();if(user)load();else $('login').classList.add('on')}function render(){const g=$('grid');g.innerHTML='';const list=prizes.slice(0,9);while(list.length<8)list.push({name:'幸运奖品'});for(let i=0;i<9;i++){if(i===4){g.insertAdjacentHTML('beforeend','<div class="drawbox"><div class="logo">P</div><button class="drawbtn" id="go" onclick="draw()">点击抽奖</button></div>');continue}const p=list[i<4?i:i-1]||{name:'幸运奖品',subtitle:''};g.insertAdjacentHTML('beforeend',`<div class="tile">${p.image?`<img src="${p.image}">`:'<div class="emoji">🎁</div>'}<b>${esc(p.name)}</b><small>${esc(p.subtitle||'幸运奖励')}</small></div>`)} }function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}async function login(){const n=$('username').value.trim();if(!n)return alert('请输入用户名');try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:n})});user=n;localStorage.setItem('ps_user',n);$('login').classList.remove('on');sync(d.user)}catch(e){alert(e.message)}}async function load(){try{const d=await api('/api/user/'+encodeURIComponent(user));sync(d.user)}catch(e){localStorage.removeItem('ps_user');$('login').classList.add('on')}}function sync(u){$('uname').textContent=u.username;$('draws').textContent=u.draws;$('total').textContent=u.total}async function redeem(){if(!user)return $('login').classList.add('on');try{const d=await api('/api/redeem',{method:'POST',body:JSON.stringify({username:user,code:$('code').value})});$('code').value='';sync(d.user);alert(d.message)}catch(e){alert(e.message)}}async function draw(){if(!user)return $('login').classList.add('on');const b=$('go');b.disabled=true;b.classList.add('loading');b.textContent='抽奖中…';try{await new Promise(r=>setTimeout(r,1300));const d=await api('/api/draw',{method:'POST',body:JSON.stringify({username:user})});sync(d.user);$('rname').textContent=d.prize.name;$('rsub').textContent=(d.prize.subtitle||'恭喜获得奖励')+' · 兑奖码 '+d.record.code;$('rimg').innerHTML=d.prize.image?`<img src="${d.prize.image}">`:`<div class="emoji">🏆</div>`;$('result').classList.add('on')}catch(e){alert(e.message)}finally{b.disabled=false;b.classList.remove('loading');b.textContent='点击抽奖'}}function closeResult(){$('result').classList.remove('on')}init();</script></body></html>
