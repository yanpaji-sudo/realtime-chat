<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实时聊天系统</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:30px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #0001}.head{padding:18px 20px;background:#111827;color:#fff;font-size:18px;font-weight:700}.status{font-size:12px;font-weight:400;opacity:.75;margin-top:5px}.messages{height:600px;overflow:auto;padding:18px}.msg{margin:10px 0;display:flex}.msg.me{justify-content:flex-end}.bubble{max-width:78%;padding:11px 14px;border-radius:14px;background:#eef0f3;white-space:pre-wrap;word-break:break-word}.me .bubble{background:#111827;color:#fff}.time{font-size:10px;opacity:.55;margin-top:5px}.input{display:flex;padding:12px;border-top:1px solid #eee;gap:8px}.input input{flex:1;padding:13px;border:1px solid #ddd;border-radius:10px;outline:none}.input button{padding:0 20px;border:0;border-radius:10px;background:#111827;color:#fff}</style></head><body><div class="wrap"><div class="head">实时聊天系统<div class="status" id="status">正在连接...</div></div><div class="messages" id="messages"></div><div class="input"><input id="input" placeholder="回复消息..." autocomplete="off"><button id="send">发送</button></div></div><script src="/socket.io/socket.io.js"></script><script>const roomId=location.pathname.split('/').filter(Boolean).pop(),socket=io(),box=document.getElementById('messages'),input=document.getElementById('input'),status=document.getElementById('status');function add(m){const row=document.createElement('div');row.className='msg '+(m.type==='admin'?'me':'');const b=document.createElement('div');b.className='bubble';b.textContent=m.text;const t=document.createElement('div');t.className='time';t.textContent=m.time;b.appendChild(t);row.appendChild(b);box.appendChild(row);box.scrollTop=box.scrollHeight}socket.on('connect',()=>{status.textContent='已连接';socket.emit('joinRoom',{roomId,role:'admin'})});socket.on('disconnect',()=>status.textContent='连接中断，正在重连...');socket.on('history',ms=>{box.innerHTML='';ms.forEach(add)});socket.on('message',add);function send(){const v=input.value.trim();if(!v)return;socket.emit('sendMessage',v);input.value='';input.focus()}document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});</script></body></html>
