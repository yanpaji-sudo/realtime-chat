<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>磐石甄选 · 抽奖后台</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#222;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.head{background:#8c0712;color:#ffe99a;padding:18px;border-radius:12px;margin-bottom:12px}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.form input,.form select{padding:10px;border:1px solid #ddd;border-radius:7px}.btn{padding:10px 14px;border:0;border-radius:7px;background:#a70816;color:white;cursor:pointer}.btn.alt{background:#eee;color:#333}.prize{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.prize img{width:65px;height:65px;object-fit:contain}.table{overflow:auto;max-height:430px}.row{padding:8px;border-bottom:1px solid #eee;font-size:12px}.danger{background:#b40016}.hint{font-size:12px;color:#777}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><main class="wrap"><div class="head"><h2 style="margin:0">磐石甄选中秋国庆七天乐 · 管理后台</h2><div style="font-size:12px">奖品、图片、权重、库存、用户抽奖次数、活动记录统一管理</div></div><div id="login" class="card"><h3>管理员登录</h3><input id="pwd" type="password" placeholder="管理员密码" style="padding:11px;width:260px"><button class="btn" onclick="login()">登录</button></div><div id="app" style="display:none"><div class="grid"><section class="card"><h3>添加 / 编辑奖品</h3><div class="form"><input id="pid" placeholder="编辑ID（新增可空）"><input id="pname" placeholder="奖品名称"><input id="psub" placeholder="副标题"><input id="weight" type="number" min="0" placeholder="中奖权重"><input id="stock" type="number" min="0" placeholder="库存"><label><input id="enabled" type="checkbox" checked> 启用</label><input id="file" type="file" accept="image/*"></div><div style="margin-top:8px"><button class="btn" onclick="savePrize()">保存奖品</button><button class="btn alt" onclick="clearForm()">清空</button></div><p class="hint">权重越高，相对中奖概率越高。图片建议控制在2MB以内。</p></section><section class="card"><h3>指定用户活动奖励</h3><div class="form"><input id="assignUser" placeholder="用户名"><select id="assignPrize"></select></div><button class="btn" style="margin-top:8px" onclick="assign()">设置下一次奖励</button><p class="hint">用于客服补发、活动预设或经用户明确知悉的奖励安排；应按活动规则使用，不应冒充随机结果。</p><hr><h3>赠送抽奖次数</h3><div class="form"><input id="grantUser" placeholder="用户名"><input id="grantN" type="number" min="1" placeholder="次数"></div><button class="btn" style="margin-top:8px" onclick="grant()">赠送次数</button></section></div><section class="card"><h3>奖品管理</h3><div id="prizes"></div></section><section class="card"><div style="display:flex;justify-content:space-between"><h3>抽奖记录</h3><button class="btn" onclick="exportData()">导出记录</button></div><div class="table" id="records"></div></section></div></main><script>let pwd='',data=null;const $=id=>document.getElementById(id);async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json','x-admin-password':pwd};const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}async function login(){pwd=$('pwd').value;try{await api('/api/admin/login',{method:'POST',body:'{}'});$('login').style.display='none';$('app').style.display='block';load()}catch(e){alert(e.message)}}async function load(){data=await api('/api/admin/data');render()}function render(){const ps=$('prizes');ps.innerHTML=data.prizes.map(p=>`<div class="prize"><div>${p.image?`<img src="${p.image}">`:'🎁'}</div><div><b>${esc(p.name)}</b><div class="hint">${esc(p.subtitle)} · 权重 ${p.weight} · 库存 ${p.stock} · ${p.enabled?'已启用':'已停用'}</div><div class="hint">ID: ${p.id}</div></div><div><button class="btn" onclick='edit(${JSON.stringify(p.id)})'>编辑</button> <button class="btn danger" onclick='delp(${JSON.stringify(p.id)})'>删除</button></div></div>`).join('');$('assignPrize').innerHTML=data.prizes.filter(p=>p.enabled).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('records').innerHTML=data.records.map(r=>`<div class="row"><b>${esc(r.username)}</b> → ${esc(r.prizeName)}　${r.time}<br><span class="hint">${r.code}</span></div>`).join('')||'<div>暂无记录</div>'}function edit(id){const p=data.prizes.find(x=>x.id===id);$('pid').value=p.id;$('pname').value=p.name;$('psub').value=p.subtitle;$('weight').value=p.weight;$('stock').value=p.stock;$('enabled').checked=p.enabled;window.scrollTo(0,0)}function clearForm(){['pid','pname','psub','weight','stock'].forEach(x=>$(x).value='');$('enabled').checked=true;$('file').value=''}async function savePrize(){try{let image='';const f=$('file').files[0];if(f){if(f.size>2*1024*1024)return alert('图片请控制在2MB以内');image=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}else if($('pid').value){image=data.prizes.find(p=>p.id===$('pid').value)?.image||''}const p={id:$('pid').value||undefined,name:$('pname').value,subtitle:$('psub').value,weight:Number($('weight').value),stock:Number($('stock').value),enabled:$('enabled').checked,image};await api('/api/admin/prizes',{method:'POST',body:JSON.stringify(p)});clearForm();load()}catch(e){alert(e.message)}}async function delp(id){if(!confirm('确定删除？'))return;await api('/api/admin/prizes/'+id,{method:'DELETE'});load()}async function assign(){try{await api('/api/admin/assign',{method:'POST',body:JSON.stringify({username:$('assignUser').value,prizeId:$('assignPrize').value})});alert('已设置该用户下一次活动奖励');load()}catch(e){alert(e.message)}}async function grant(){try{const d=await api('/api/admin/grant',{method:'POST',body:JSON.stringify({username:$('grantUser').value,draws:Number($('grantN').value)})});alert('成功，当前次数：'+d.user.draws);load()}catch(e){alert(e.message)}}function exportData(){const a=document.createElement('a');a.href='/api/admin/export';a.click()}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}</script></body></html>
