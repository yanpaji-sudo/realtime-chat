<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人中心 - 磐石甄选</title><style>*{box-sizing:border-box}body{margin:0;background:#61030b;color:#ffe99a;font-family:Arial,"Microsoft YaHei",sans-serif}.page{max-width:560px;margin:auto;padding:10px 12px 70px}.card{background:#8b0612;border:1px solid #f2d15f;border-radius:14px;padding:15px;margin-bottom:9px;box-shadow:inset 0 0 0 2px #a52b15}.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:20px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px;border:1px solid #e9c956;border-radius:12px}.stat b{display:block;font-size:24px;margin-top:6px}.list{max-height:440px;overflow:auto}.row{display:flex;gap:10px;padding:12px 2px;border-top:1px solid #b5312a;align-items:center}.ico{width:40px;height:40px;border-radius:10px;background:#fff0a0;color:#7d120b;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.row img{width:40px;height:40px;object-fit:contain}.row b{display:block;font-size:12px;color:#fff1a5}.row small{display:block;color:#e4b77b;font-size:9px;margin-top:3px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:flex;background:#65030c;border-top:1px solid #e9c752;padding:7px}.bottom button{flex:1;background:none;border:0;color:#ffe99a;padding:9px}.bottom .active{background:#f2ca49;color:#75100b;border-radius:9px}</style></head><body><main class="page"><div class="card"><div class="top"><div><small>欢迎回来</small><br><b id="name">-</b><br><small>账号：<span id="account">-</span></small></div><button onclick="logout()" style="background:none;color:#ffe99a;border:1px solid #e9c956;border-radius:8px;padding:8px 14px">⇥ 退出</button></div></div><div class="stats"><div class="stat card">可用抽奖次数<b id="draws">0</b></div><div class="stat card">累计抽奖记录<b id="total">0</b></div></div><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>🎁 我的抽奖记录</b><small>最近 100 条</small></div><div class="list" id="list"></div></div></main><nav class="bottom"><button onclick="location.href='/'">🎁 幸运抽奖</button><button class="active">♙ 个人中心</button></nav><script>const u=localStorage.getItem('ps_user');if(!u)location.href='/';async function load(){const r=await fetch('/api/user/'+encodeURIComponent(u));const d=await r.json();if(!r.ok)return;document.getElementById('name').textContent=d.user.username;document.getElementById('account').textContent=d.user.username;document.getElementById('draws').textContent=d.user.draws;document.getElementById('total').textContent=d.user.total;const l=document.getElementById('list');l.innerHTML=d.records.length?d.records.map(x=>`<div class="row">${x.prizeImage?`<img src="${x.prizeImage}">`:'<div class="ico">🎁</div>'}<div><b>${esc(x.prizeName)}</b><small>${x.time}</small><small>${x.code}</small></div></div>`).join(''):'<div style="text-align:center;padding:40px 0">暂无抽奖记录</div>'}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}function logout(){localStorage.removeItem('ps_user');location.href='/'}load();</script></body></html>
