name: Inspect isolated whale-team test environment
on:
  push:
    branches: [member-tree-jingyu-isolated-1000]
    paths: ['.github/workflows/jingyu-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read exact safe source lines
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          sel={
           'member-tree/app.py':[(27,49),(269,287),(345,380),(1210,1250),(760,770)],
           'member-tree/static/app.js':[(740,790)],
           'member-tree/static/index.html':[(1,5)]
          }
          for f,rr in sel.items():
           print("FILE",f)
           ls=Path(f).read_text().splitlines()
           for a,b in rr:
            for i in range(a-1,min(b,len(ls))):
             x=ls[i]
             if 'password' in x.lower() or 'SESSION_SECRET' in x or 'ADMIN_HASH' in x or 'VIEWER_HASH' in x:
              if f.endswith('app.py') and i+1 in (35,37,38):
               print(i+1,'[configuration lines redacted]')
              else:
               print(i+1,x[:500].replace("hash_pw(data.password)","hash_pw([input])"))
             else: print(i+1,x[:1800])
          PY
