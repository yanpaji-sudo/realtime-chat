name: Inspect isolated whale-team test environment
on:
  push:
    branches: [member-tree-jingyu-isolated-1000]
    paths: ['.github/workflows/jingyu-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read report and startup entry points
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          py=Path('member-tree/app.py').read_text().splitlines()
          for a,b in [(130,159),(191,260),(494,545),(1900,1970),(1970,2030)]:
           print('--- app.py',a,b)
           for i in range(a-1,min(b,len(py))):
            v=py[i]
            if 'password' in v.lower() or 'SECRET' in v: print(i+1,'[credentials redacted]')
            else: print(i+1,v[:1300])
          PY
