name: Validate isolated DFX 05 and 09 team groups before release
on:
  push:
    branches: [dfx-add-groups-05-09-v2]
    paths: ['dfx-groups-v2/**','.github/workflows/dfx-groups-v2-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned existing DFX deployment, no production data
        run: |
          set -euo pipefail
          git fetch --no-tags origin cf13717830f88f5c01be2922a634f30778c2707b
          test "$(git rev-parse FETCH_HEAD:member-tree-deploy/payload.b64)" = "a11fec061f2707922c1c24b04442d4fdd2137ff9"
          git show FETCH_HEAD:member-tree-deploy/payload.b64 | base64 -d | tar xz
          test -f member-tree/app.py
          grep -q 'DFX数据图' member-tree/static/index.html
          grep -q '10位管理员独立登录' member-tree/static/index.html
          find member-tree -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) -delete
      - name: Add new groups and compile
        run: |
          set -euo pipefail
          python3 dfx-groups-v2/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install test dependencies
        run: python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Verify backend and frontend group support including empty 05/09 groups
        run: |
          set -euo pipefail
          cd member-tree
          python3 - <<'PY'
          import os,json
          os.environ['SESSION_SECRET']='test-only-secret'
          os.environ['VIEWER_PASSWORD_HASH']='test-only-hash'
          import app
          from pathlib import Path
          expected=('01','02','03','05','06','08','09')
          assert app.REPORT_GROUPS==expected,app.REPORT_GROUPS
          assert app.dfx_public_status()['site']=='DFX数据图'
          assert app.dfx_public_status()['admin_count']==10
          assert not app.dfx_public_status()['storage_persistent']
          original_active,original_sums=app.active_rows,app.sums
          try:
              app.active_rows=lambda db: []
              app.sums=lambda rows: ([{'group_account':'05','joined_on':'2026-11-11','balance_cents':6000,'daily_withdraw_cents':1000,'stake_cents':4000},
                                     {'group_account':'09','joined_on':'2026-11-11','balance_cents':10000,'daily_withdraw_cents':2000,'stake_cents':3000}],{})
              groups=app.report_rows_today(object(),'2026-11-11')
              assert set(expected).issubset(groups)
              assert groups['05']['member_count']==1 and groups['09']['member_count']==1
              assert groups['05']['balance_cents']==6000 and groups['09']['balance_cents']==10000
              assert groups[app.REPORT_ALL]['member_count']==2
          finally:
              app.active_rows,app.sums=original_active,original_sums
          js=Path('static/app.js').read_text(encoding='utf-8')
          html=Path('static/index.html').read_text(encoding='utf-8')
          source=Path('app.py').read_text(encoding='utf-8')
          assert "const TREE_GROUPS=['01','02','03','05','06','08','09'];" in js
          assert "TREE_GROUPS.includes(r.group_account)" in js
          assert "['05','05组：本月逐日']" in js and "['09','09组：本月逐日']" in js
          assert 'value="05">05小组' in html and 'value="09">09小组' in html
          assert "fix['group_account'] not in ('01','02','03','05','06','08','09')" in source
          assert '总存款' in js and 'DFX数据图' in html
          print('DFX GROUPS 05 09, reports, filters, backups, preserved deposit label ALL OK')
          PY
          python3 -m pytest -q tests/test_layer_export.py tests/test_no_data_modification.py
          node tests/test_v28_compact.cjs
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v33_rank_alert.cjs
      - name: Package tested isolated DFX source
        run: |
          set -euo pipefail
          find member-tree -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) -delete
          tar -czf /tmp/dfx-v2-group.tgz member-tree
          base64 -w0 /tmp/dfx-v2-group.tgz > member-tree-deploy/payload.b64
          git config user.name "DFX Group Upgrade CI"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "Tested DFX seven groups 01 02 03 05 06 08 09"
          git push origin HEAD:dfx-add-groups-05-09-v2
