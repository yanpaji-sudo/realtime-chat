name: Test and bundle isolated V26 patch
on:
  push:
    branches: [member-tree-v26-safe-fix]
    paths: ['.github/workflows/member-tree-v26-build.yml', 'member-tree-v26/patch.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch isolated bundle
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v26/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install test dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt
          python3 -m pip install pytest httpx
      - name: Run V26 and regression tests
        run: |
          cd member-tree
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v11_backup.py tests/test_v25_all_level_stake.py tests/test_v20_daily_settlement.py tests/test_v24_palette_risk.cjs || exit 1
      - name: Pack tested files and commit to test branch
        run: |
          tar -czf /tmp/member-tree-v26.tgz member-tree
          base64 -w0 /tmp/member-tree-v26.tgz > member-tree-deploy/payload.b64
          git config user.name "V26 Isolated Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V26: vivid neon withdrawal halo and safe duplicate backup restoration"
          git push origin HEAD:member-tree-v26-safe-fix
