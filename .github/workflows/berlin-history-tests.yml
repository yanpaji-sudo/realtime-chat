name: Test Berlin historical newcomer calendar (NO DEPLOY)
on:
  push:
    branches: [berlin-historical-newcomer-calendar-dev-20261125]
    paths:
      - 'member-tree-deploy/berlin_patch.py'
      - 'member-tree-deploy/berlin_history_join_calendar_patch.py'
      - 'member-tree-deploy/test_berlin_history_calendar.py'
      - '.github/workflows/berlin-history-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from same original release without connecting to live DB
        run: |
          set -euo pipefail
          git fetch origin 2aaeeac32ce8d579bee4a8ec5370952dd246c11d
          git show 2aaeeac32ce8d579bee4a8ec5370952dd246c11d:member-tree-deploy/payload.b64 >/tmp/berlin_formal.b64
          python member-tree-deploy/berlin_patch.py
          python -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Test historical calendar dates, highlights and focus without any DB
        run: python member-tree-deploy/test_berlin_history_calendar.py
      - name: Install temporary test dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Preserve existing uploads, finance and join-day import behavior
        run: |
          python member-tree-deploy/test_berlin_bulk_new_members.py
          python member-tree-deploy/test_berlin_single_member_upsert.py
          python member-tree-deploy/test_berlin_bidirectional_finance.py
          python member-tree-deploy/test_berlin_manual_recharge_reconcile.py
