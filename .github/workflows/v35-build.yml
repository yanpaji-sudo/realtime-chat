name: Verify and package V35 conversational AI tutor
on:
  push:
    branches: [member-tree-v35-chat-tutor]
    paths:
      - 'member-tree-v35/backend_patch.py'
      - 'member-tree-v35/frontend_patch.py'
      - 'member-tree-v35/test_v35_tutor.py'
      - 'member-tree-v35/test_v35_frontend.cjs'
      - '.github/workflows/v35-build.yml'
permissions:
  contents: write
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V34 production baseline
        run: |
          git fetch --no-tags origin member-tree-render
          test "$(git rev-parse FETCH_HEAD)" = "afcf494ff2f1642cc81d4675a49d38f482f77a3b"
          git show FETCH_HEAD:member-tree-deploy/payload.b64 | base64 -d | tar xz
          python3 member-tree-v35/backend_patch.py
          python3 member-tree-v35/frontend_patch.py
          cp member-tree-v35/test_v35_tutor.py member-tree/tests/test_v35_tutor.py
          cp member-tree-v35/test_v35_frontend.cjs member-tree/tests/test_v35_frontend.cjs
          python3 -m py_compile member-tree/app.py member-tree/academy.py
          node --check member-tree/static/app.js
      - name: Install test environment
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Verify new chat, diagnostics, knowledge integrity and old screens
        run: |
          cd member-tree
          python3 -m pytest -q tests/test_v35_tutor.py tests/test_v34_academy.py
          node tests/test_v35_frontend.cjs
          node tests/test_v34_academy.cjs
          node tests/test_v33_rank_alert.cjs
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v31_stake_threshold.cjs
          node tests/test_v30_balance.cjs
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v33_alert_state.py tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Commit tested artifact to isolated V35 branch
        run: |
          tar -czf /tmp/member-tree-v35.tgz member-tree
          base64 -w0 /tmp/member-tree-v35.tgz > member-tree-deploy/payload.b64
          git config user.name "V35 Tutor CI"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V35: multi-turn AI chat window and provider connection diagnostics"
          git push origin HEAD:member-tree-v35-chat-tutor
