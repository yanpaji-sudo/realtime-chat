name: 部署磐石知识闯关系统
on:
  workflow_dispatch:
  push:
    branches:
      - panshi-quiz-cloud
    paths:
      - 'panshi-quiz/**'
      - '.github/workflows/panshi-quiz-cloudflare.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panshi-quiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm install
      - name: JavaScript 语法与核心测试
        run: |
          node --check public/app.js
          node --check src/worker.js
          npm test
      - name: 写入 D1 数据库标识
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "Missing D1_DATABASE_ID"; exit 1; }
          node -e "const fs=require('fs');const f='wrangler.jsonc';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('REPLACE_WITH_YOUR_D1_DATABASE_ID',process.env.D1_DATABASE_ID))"
      - name: 执行云端数据库迁移
        run: npx wrangler d1 migrations apply panshi-quiz-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 部署 Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
