name: 部署磐石知识闯关系统
on:
  workflow_dispatch:
  push:
    branches:
      - panshi-quiz-cloud
    paths:
      - 'panshi-quiz/**'
      - '.github/workflows/panshi-quiz-cloudflare.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panshi-quiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm install
      - name: JavaScript 语法与核心测试
        run: |
          node --check public/app.js
          node --check src/worker.js
          npm test
      - name: 写入 D1 数据库标识
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "Missing D1_DATABASE_ID"; exit 1; }
          node -e "const fs=require('fs');const f='wrangler.jsonc';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('REPLACE_WITH_YOUR_D1_DATABASE_ID',process.env.D1_DATABASE_ID))"
      - name: 执行云端数据库迁移
        run: npx wrangler d1 migrations apply panshi-quiz-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 部署 Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 线上接口烟雾测试（同时定位数据库问题）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo "=== Database schema ==="
          npx wrangler d1 execute panshi-quiz-db --remote --command "PRAGMA table_info(attempts)" || true
          echo "=== Database challenges table ==="
          npx wrangler d1 execute panshi-quiz-db --remote --command "SELECT count(*) FROM pk_challenges" || true
          echo "=== Health check ==="
          curl --max-time 15 -sSi https://panshi-knowledge-quiz.yanpaji.workers.dev/api/health | head -c 1400
          echo
          echo "=== Leaderboard ==="
          curl --max-time 15 -sSi https://panshi-knowledge-quiz.yanpaji.workers.dev/api/leaderboard | head -c 1400
          echo
          echo "=== Start quiz HTTP status ==="
          curl --max-time 15 -sSi -X POST https://panshi-knowledge-quiz.yanpaji.workers.dev/api/start -H 'Content-Type: application/json' -d '{"nickname":"部署接口检测"}' | head -c 500
          echo
          echo "=== SQL leaderboard direct ==="
          npx wrangler d1 execute panshi-quiz-db --remote --command "WITH r AS(SELECT id,nickname,score,elapsed_seconds,finished_at,ROW_NUMBER() OVER(PARTITION BY nickname ORDER BY score DESC,elapsed_seconds ASC,finished_at ASC) rn FROM attempts WHERE finished_at IS NOT NULL AND defeated_at IS NULL AND (is_pk=0 OR pk_success=1)) SELECT id,nickname,score,elapsed_seconds,finished_at,(SELECT COUNT(*) FROM pk_challenges pc WHERE pc.target_nickname=r.nickname) AS challenged_count FROM r WHERE rn=1 ORDER BY score DESC,elapsed_seconds ASC,finished_at ASC LIMIT 50" || true

