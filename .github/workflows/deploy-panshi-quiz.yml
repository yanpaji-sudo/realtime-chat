name: 发布磐石知识闯关（Cloudflare）
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panshi-quiz
    steps:
      - name: 读取磐石答题源码分支（不更改现有网站）
        uses: actions/checkout@v4
        with:
          ref: panshi-quiz-cloud
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm install
      - name: 执行测试
        run: npm test
      - name: 配置 D1 数据库
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "缺少 D1_DATABASE_ID Secret"; exit 1; }
          node -e "const fs=require('fs');const f='wrangler.jsonc';const old=fs.readFileSync(f,'utf8');const s=old.replace('REPLACE_WITH_YOUR_D1_DATABASE_ID',process.env.D1_DATABASE_ID);fs.writeFileSync(f,s);"
      - name: 初始化云数据库
        run: npx wrangler d1 migrations apply panshi-quiz-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 发布网站并显示网址
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
