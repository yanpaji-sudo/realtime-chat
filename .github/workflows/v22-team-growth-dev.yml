name: Validate V22 team growth percent column (NO DEPLOY)
on:
  push:
    branches: [v22-team-growth-percent-dev-20261125]
    paths:
      - '.github/workflows/v22-team-growth-dev.yml'
      - 'member-tree-v22-visual/team_growth_percentage_patch.py'
      - 'member-tree-v22-visual/test_team_growth_percentage.cjs'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V22 from unchanged formal release
        run: |
          set -euo pipefail
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/app.py member-tree/academy.py member-tree/requirements.txt >/tmp/v22-unchanged-ranking.sha256
          python member-tree-v22-visual/team_growth_percentage_patch.py
          sha256sum --check /tmp/v22-unchanged-ranking.sha256
          node --check member-tree/static/app.js
      - name: Verify 4 formulas, dates, actual leaderboard columns and details
        run: node member-tree-v22-visual/test_team_growth_percentage.cjs
      - name: Preserve V22 fullscreen preview and red historic visual tests
        run: |
          node member-tree-v22-visual/test_history_popup_visible_scrollbar.cjs
          node member-tree-v22-visual/test_history_popup_maximized.cjs
          node member-tree-v22-visual/test_single_red_ring_sortable_list.cjs
      - name: Install isolated SQLite regression dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Verify no modification to withdrawal history and balances
        run: |
          python member-tree-v22-visual/test_history_api.py
          python member-tree-v22-visual/test_weekly_monthly_api.py
