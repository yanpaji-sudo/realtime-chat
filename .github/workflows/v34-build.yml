name: Verify V34 knowledge hub and build isolated package
on:
  push:
    branches: [member-tree-v34-ai-knowledge-hub]
    paths:
      - 'member-tree-v34/academy.py'
      - 'member-tree-v34/frontend_patch.py'
      - 'member-tree-v34/test_academy.py'
      - '.github/workflows/v34-build.yml'
permissions:
  contents: write
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract known V33 production code into build workspace
        run: |
          git fetch --no-tags origin member-tree-render
          test "$(git rev-parse FETCH_HEAD)" = "fd7b800fd4acc61ea8d8fd9c036e83b1f62b85aa"
          git show FETCH_HEAD:member-tree-deploy/payload.b64 | base64 -d | tar xz
          cp member-tree-v34/academy.py member-tree/academy.py
          cp member-tree-v34/test_academy.py member-tree/tests/test_v34_academy.py
          python3 member-tree-v34/frontend_patch.py
          python3 -m py_compile member-tree/app.py member-tree/academy.py
          node --check member-tree/static/app.js
      - name: Set up tests
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Check Academy isolation and previous feature regressions
        run: |
          cd member-tree
          python3 -m pytest -q tests/test_v34_academy.py
          node tests/test_v34_academy.cjs
          node tests/test_v33_rank_alert.cjs
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v31_stake_threshold.cjs
          node tests/test_v30_balance.cjs
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v33_alert_state.py tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Commit tested V34 package to isolated branch
        run: |
          tar -czf /tmp/member-tree-v34.tgz member-tree
          base64 -w0 /tmp/member-tree-v34.tgz > member-tree-deploy/payload.b64
          git config user.name "V34 Academy Verification"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V34: Academy knowledge hub and AI tutor (separate tables)"
          git push origin HEAD:member-tree-v34-ai-knowledge-hub
