name: Inspect V33 alert timeline and ranking persistence
on:
  push:
    branches: [member-tree-v33-alerts-rank-remarks]
    paths: ['.github/workflows/member-tree-v33-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source read-only
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['member-tree/app.py','member-tree/static/app.js','member-tree/static/style.css']
          terms={
           'member-tree/app.py':r'CREATE TABLE|team_names|rank|report|rename|remark|memo|stake|withdraw|deposit|business_day|on_event|UPDATE members|ALTER TABLE|def db_init',
           'member-tree/static/app.js':r'teamName|team_names|renameTeam|rank|teamRemark|teamNotes|备注|改队名|team_name|group_account|v29Position|positionAlarm|v29TeamStats|daily_withdraw|daily_stake',
           'member-tree/static/style.css':r'v29-position|ranking|risk-banner|branch-view|v28-compact-tooltip|branch-canvas',
          }
          for file in files:
           lines=Path(file).read_text(encoding='utf-8').splitlines()
           p=re.compile(terms[file],re.I)
           match=[i for i,l in enumerate(lines) if p.search(l)]
           print('--- FILE',file,'total',len(lines),'match',len(match))
           for i in match[:140 if file.endswith('.js') else (100 if file.endswith('.py') else 25)]:
            if file.endswith('.py') and ('password' in lines[i].lower() or 'secret' in lines[i].lower()):
             print(i+1,'[redacted]')
            else:
             print(i+1,repr(lines[i][:420]))
          js=Path('member-tree/static/app.js').read_text(encoding='utf-8').splitlines()
          for a,b in [(1,36),(210,255),(272,335),(463,565),(640,760),(950,966)]:
           print('--- JS LINES',a,b)
           for i in range(a-1,min(b,len(js))): print(i+1,js[i][:2100])
          py=Path('member-tree/app.py').read_text(encoding='utf-8').splitlines()
          for a,b in [(35,70),(110,215),(400,475),(980,1050),(1660,1750)]:
           print('--- PY LINES',a,b)
           for i in range(a-1,min(b,len(py))):
            if any(k in py[i].lower() for k in ('password','secret','token')): print(i+1,'[redacted]')
            else: print(i+1,py[i][:1350])
          PY
