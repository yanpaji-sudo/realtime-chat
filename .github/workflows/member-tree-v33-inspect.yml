name: Inspect V33 restore and team-name write details
on:
  push:
    branches: [member-tree-v33-alerts-rank-remarks]
    paths: ['.github/workflows/member-tree-v33-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          p=Path('member-tree/app.py').read_text().splitlines()
          j=Path('member-tree/static/app.js').read_text().splitlines()
          for a,b in [(500,536),(1416,1502),(1514,1647),(1790,1810),(2097,2122)]:
           print('==== PY',a,b)
           for i in range(a-1,min(len(p),b)): print(i+1,p[i][:1900])
          for a,b in [(45,90),(1000,1042)]:
           print('==== JS',a,b)
           for i in range(a-1,min(len(j),b)):print(i+1,j[i][:1800])
          PY
