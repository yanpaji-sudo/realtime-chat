name: Test V31 stake-aware position alerts
on:
  push:
    branches: [member-tree-v31-stake-balance-threshold]
    paths: ['member-tree-v31/patch.py','.github/workflows/member-tree-v31-build.yml']
permissions:
  contents: write
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated minimal frontend update
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v31/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install test dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Check stake thresholds, legacy UI, and encrypted backup functionality
        run: |
          cd member-tree
          node tests/test_v31_stake_threshold.cjs
          node tests/test_v30_balance.cjs
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Commit tested bundle to isolated branch only
        run: |
          tar -czf /tmp/member-tree-v31.tgz member-tree
          base64 -w0 /tmp/member-tree-v31.tgz > member-tree-deploy/payload.b64
          git config user.name "V31 Verified Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V31: 5000 stake uses 7000 warning threshold"
          git push origin HEAD:member-tree-v31-stake-balance-threshold
