name: Inspect Berlin recharge reconciliation in isolated branch
on:
  push:
    branches: [berlin-recharge-reconcile-dev-20261123]
    paths:
      - '.github/workflows/berlin-recharge-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source without deploying or accessing production DB
        run: |
          git fetch origin 2aaeeac32ce8d579bee4a8ec5370952dd246c11d
          git show 2aaeeac32ce8d579bee4a8ec5370952dd246c11d:member-tree-deploy/payload.b64 > /tmp/berlin_formal.b64
          python member-tree-deploy/berlin_patch.py
          python - <<'PY'
          from pathlib import Path
          src=Path('member-tree/app.py').read_text()
          markers=['def berlin_recharge_preview(', 'def berlin_recharge_confirm(', 'def berlin_recharge_supplement(', 'def active_rows(', 'def settle_past_days(', '@app.post(\'/api/recharge', 'CREATE TABLE IF NOT EXISTS berlin_daily_recharge', 'def create_member(', 'def update_member(']
          for marker in markers:
              start=src.find(marker)
              print('===START===',marker,start,flush=True)
              if start>=0:
                  end=src.find('\n\ndef ',start+5)
                  if end<0 or end-start>13000:end=start+12500
                  print(src[start:end],flush=True)
          print('===SCHEMA===', flush=True)
          for line in src.splitlines():
              if 'berlin_daily_recharge' in line or 'CREATE TABLE IF NOT EXISTS members' in line:
                  print(line[:900],flush=True)
          PY
