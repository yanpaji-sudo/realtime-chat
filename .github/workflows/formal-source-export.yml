name: Export clean formal member-tree source
on:
  push:
    branches:
      - formal-source-export-clean-20261112
    paths:
      - .github/workflows/formal-source-export.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formal production source snapshot
        uses: actions/checkout@v4

      - name: Extract, sanitize and package source-only archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/formal-source /tmp/export
          base64 -d member-tree-deploy/payload.b64 | tar -xz -C /tmp/formal-source
          ROOT=/tmp/formal-source/member-tree
          test -d "$ROOT"
          test -f "$ROOT/app.py"

          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import re, shutil, sys

          root = Path(sys.argv[1])
          remove_dirs = {
              ".git", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache",
              "node_modules", "backups", "backup", "uploads", "exports",
              "runtime", "instance", "logs", "data"
          }
          remove_suffixes = {
              ".sqlite", ".sqlite3", ".db", ".db-wal", ".db-shm", ".log",
              ".csv", ".xlsx", ".xls", ".jsonl", ".dump", ".bak", ".backup",
              ".tar", ".tgz", ".zip", ".pyc", ".pyo", ".pem", ".key", ".p12", ".pfx"
          }
          remove_names = {".env"}
          data_json_patterns = re.compile(
              r"(member.*backup|user.*backup|tree.*backup|snapshot|export|backup|"
              r"member.*data|user.*data|account.*data|seed.*data|demo.*data|fixture.*data)",
              re.I
          )

          # Delete data/runtime directories first, deepest paths first.
          for p in sorted(root.rglob("*"), key=lambda x: len(x.parts), reverse=True):
              if p.is_dir() and p.name.lower() in remove_dirs:
                  shutil.rmtree(p, ignore_errors=True)
              elif p.is_file():
                  name = p.name.lower()
                  if name in remove_names or name.startswith(".env."):
                      p.unlink(missing_ok=True)
                  elif p.suffix.lower() in remove_suffixes:
                      p.unlink(missing_ok=True)
                  elif p.suffix.lower() == ".json" and data_json_patterns.search(p.stem):
                      p.unlink(missing_ok=True)

          # Validate source syntax without retaining generated bytecode.
          import py_compile
          py_compile.compile(str(root / "app.py"), doraise=True)
          academy = root / "academy.py"
          if academy.exists():
              py_compile.compile(str(academy), doraise=True)
          static_js = root / "static" / "app.js"
          if static_js.exists():
              import subprocess
              subprocess.run(["node", "--check", str(static_js)], check=True)
          for p in root.rglob("__pycache__"):
              shutil.rmtree(p, ignore_errors=True)

          # Detect remaining common runtime data and credential files.
          bad = []
          for p in root.rglob("*"):
              if p.is_file():
                  if p.suffix.lower() in remove_suffixes or p.name.lower() in remove_names or p.name.lower().startswith(".env."):
                      bad.append(str(p.relative_to(root)))
          if bad:
              raise SystemExit("Runtime/data artifacts remain: " + ", ".join(bad))

          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA|EC|OPENSSH) PRIVATE KEY-----"),
              re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"postgres(?:ql)?://[^\s:'\"]+:[^@\s:'\"]+@")
          ]
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() not in {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".woff", ".woff2", ".ttf"}:
                  try:
                      text = p.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if any(rx.search(text) for rx in secret_patterns):
                      raise SystemExit("Potential credential material detected in " + str(p.relative_to(root)))

          readme = """# Formal Member Tree - Source Only

          This archive is prepared from the formal production branch `member-tree-render`.

          It contains application source code, frontend assets, source configuration, and automated tests where present.

          It intentionally excludes member records, account lists, balances, transactions, databases, SQLite files, backups, exports, uploaded files, runtime logs, caches, environment files, and credentials.

          ## Important
          - This is a source-only archive, not a data backup.
          - No production database or member data is included.
          - Configure your own secure environment variables and persistent database before running it.
          - Do not point a development copy at the formal production database.
          - This export does not deploy or modify the production service.
          """
          (root / "README_SOURCE_ONLY.md").write_text(readme, encoding="utf-8")

          print("=== Sanitized source files ===")
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  print(f"{p.relative_to(root)} ({p.stat().st_size} bytes)")
          PY

          cd /tmp/formal-source
          zip -qr /tmp/export/Formal_Member_Tree_Source_Only.zip member-tree
          test -s /tmp/export/Formal_Member_Tree_Source_Only.zip
          unzip -l /tmp/export/Formal_Member_Tree_Source_Only.zip | tail -5

      - name: Upload clean source archive
        uses: actions/upload-artifact@v4
        with:
          name: Formal-Member-Tree-Source-Only
          path: /tmp/export/Formal_Member_Tree_Source_Only.zip
          if-no-files-found: error
          retention-days: 30
