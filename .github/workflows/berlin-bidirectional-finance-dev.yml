name: Test Berlin two-way finance formats without deployment
on:
  push:
    branches: [berlin-bidirectional-finance-dev-20261124]
    paths:
      - 'member-tree-deploy/berlin_patch.py'
      - 'member-tree-deploy/berlin_bidirectional_finance_patch.py'
      - 'member-tree-deploy/test_berlin_bidirectional_finance.py'
      - '.github/workflows/berlin-bidirectional-finance-dev.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source in isolated GitHub Actions runner
        run: |
          set -euo pipefail
          git fetch origin 2aaeeac32ce8d579bee4a8ec5370952dd246c11d
          git show 2aaeeac32ce8d579bee4a8ec5370952dd246c11d:member-tree-deploy/payload.b64 >/tmp/berlin_formal.b64
          python member-tree-deploy/berlin_patch.py
          python -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install isolated test dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Test mixed account/amount order and existing cashflow safety
        run: |
          set -euo pipefail
          python member-tree-deploy/test_berlin_bidirectional_finance.py
          python member-tree-deploy/test_berlin_balance_blank_column.py
          python member-tree-deploy/test_berlin_three_line_cashflow.py
          python member-tree-deploy/test_berlin_manual_recharge_reconcile.py
          python member-tree-deploy/test_berlin_single_member_upsert.py
