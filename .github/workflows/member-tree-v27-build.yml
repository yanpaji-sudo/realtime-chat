name: Build and test V27 explicit red withdrawal rings
on:
  push:
    branches: [member-tree-v27-withdraw-red]
    paths:
      - '.github/workflows/member-tree-v27-build.yml'
      - 'member-tree-v27/patch.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch isolated V26 bundle
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v27/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Test V27 and previous versions
        run: |
          cd member-tree
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Pack and commit tested bundle to isolated branch
        run: |
          tar -czf /tmp/member-tree-v27.tgz member-tree
          base64 -w0 /tmp/member-tree-v27.tgz > member-tree-deploy/payload.b64
          git config user.name "V27 Tested Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V27: explicit vivid red withdrawal rings and red amount badge"
          git push origin HEAD:member-tree-v27-withdraw-red
