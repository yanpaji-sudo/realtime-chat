name: Publish V22 weekly and monthly historical withdrawal overview
on:
  push:
    branches: [member-tree-render]
    paths:
      - '.github/workflows/v22-week-month-withdraw-formal.yml'
permissions:
  contents: write
concurrency:
  group: v22-week-month-withdraw-formal-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify existing formal app archive before extending history UI
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:member-tree-deploy/payload.b64)" = "b29f60f1f5142a9929256433edda7c42cd43a3da"
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/academy.py member-tree/requirements.txt > /tmp/v22-preserve.sha256
      - name: Apply only read-only week/month withdrawal overview endpoint and UI
        run: |
          set -euo pipefail
          python3 member-tree-v22-visual/weekly_monthly_withdraw_api_patch.py
          python3 member-tree-v22-visual/weekly_monthly_withdraw_ui_patch.py
          sha256sum --check /tmp/v22-preserve.sha256
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
          node member-tree-v22-visual/test_weekly_monthly_ui.cjs
          node member-tree-v22-visual/test_history_ui.cjs
      - name: Install isolated regression test dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Assert week/month frequency and legacy daily history using SQLite only
        run: |
          set -euo pipefail
          python member-tree-v22-visual/test_weekly_monthly_api.py
          python member-tree-v22-visual/test_history_api.py
      - name: Verify legacy fullscreen, red withdrawal rings and compact nodes
        run: |
          set -euo pipefail
          cd member-tree
          for t in tests/test_v32_fullscreen_hover.cjs tests/test_v27_red_withdrawal_ui.cjs tests/test_v28_compact.cjs; do
            if [ -f "$t" ]; then node "$t"; fi
          done
      - name: Publish code package only; leave existing persistent PostgreSQL intact
        run: |
          set -euo pipefail
          tar -czf /tmp/v22-withdraw-periods.tgz member-tree
          base64 -w0 /tmp/v22-withdraw-periods.tgz > member-tree-deploy/payload.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member-tree-deploy/payload.b64
          if ! git diff --cached --quiet; then
            git commit -m 'V22 formal: add week/month withdrawal overview with 1/2-3/4+ day rings'
            git push origin HEAD:member-tree-render
          fi
