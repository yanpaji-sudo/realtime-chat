name: Publish V22 history fullscreen visibility and current balance column
on:
  push:
    branches: [member-tree-render]
    paths: ['.github/workflows/v22-history-portal-balance-formal.yml']
permissions:
  contents: write
concurrency:
  group: v22-history-portal-balance-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact V22 base archive and all original financial Python
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:member-tree-deploy/payload.b64)" = "72357df063fe7f8c203821c17ceb66bb9320897d"
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/app.py member-tree/academy.py member-tree/requirements.txt >/tmp/v22-protected-backend.sha256
      - name: Fix clipped fullscreen modal and add current balance to historical list
        run: |
          set -euo pipefail
          python member-tree-v22-visual/history_popup_portal_fix_patch.py
          python member-tree-v22-visual/history_popup_current_balance_patch.py
          sha256sum --check /tmp/v22-protected-backend.sha256
          node --check member-tree/static/app.js
          node member-tree-v22-visual/test_history_popup_maximized.cjs
          node member-tree-v22-visual/test_single_red_ring_sortable_list.cjs
          node member-tree-v22-visual/test_compact_withdraw_list_soft_rings.cjs
          node member-tree-v22-visual/test_history_popup_visible_scrollbar.cjs
      - name: Regression test historical finance and team ranking all-column sorting
        run: |
          node member-tree-v22-visual/test_ranking_all_columns_sort.cjs
          node member-tree-v22-visual/test_team_growth_percentage.cjs
          node member-tree-v22-visual/test_history_ui.cjs
          node member-tree-v22-visual/test_weekly_monthly_ui.cjs
      - name: Install isolated database regression dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Verify finance/ledger is read-only and original daily withdrawals remain
        run: |
          python member-tree-v22-visual/test_weekly_monthly_api.py
          python member-tree-v22-visual/test_history_api.py
      - name: Publish V22 application files only, preserve persistent database
        run: |
          set -euo pipefail
          tar -czf /tmp/v22-history-portal-balance.tgz member-tree
          base64 -w0 /tmp/v22-history-portal-balance.tgz > member-tree-deploy/payload.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member-tree-deploy/payload.b64
          if ! git diff --cached --quiet; then
            git commit -m 'V22: fix clipped maximized history and show sortable current balances'
            git push origin HEAD:member-tree-render
          fi
