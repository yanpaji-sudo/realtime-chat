name: Test and bundle V32 fullscreen compact hover fix
on:
  push:
    branches: [member-tree-v32-compact-fullscreen-tooltip]
    paths: ['member-tree-v32/patch.py','.github/workflows/member-tree-v32-build.yml']
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated V32 frontend-only patch
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v32/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install regression test dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Validate fullscreen and existing features
        run: |
          cd member-tree
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v31_stake_threshold.cjs
          node tests/test_v30_balance.cjs
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Commit tested code package to isolated branch
        run: |
          tar -czf /tmp/member-tree-v32.tgz member-tree
          base64 -w0 /tmp/member-tree-v32.tgz > member-tree-deploy/payload.b64
          git config user.name "V32 Verified Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V32: fullscreen compact hover popover inside top-layer panel"
          git push origin HEAD:member-tree-v32-compact-fullscreen-tooltip
