name: Test V22 fullscreen popup visibility and current balance (NO DEPLOY)
on:
  push:
    branches: [v22-history-popup-portal-fix-dev-20261125]
    paths:
      - '.github/workflows/v22-popup-portal-balance-dev.yml'
      - 'member-tree-v22-visual/history_popup_portal_fix_patch.py'
      - 'member-tree-v22-visual/history_popup_current_balance_patch.py'
      - 'member-tree-v22-visual/test_history_popup_maximized.cjs'
      - 'member-tree-v22-visual/test_single_red_ring_sortable_list.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact current V22 release in isolated runner
        run: |
          set -euo pipefail
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/app.py member-tree/academy.py member-tree/requirements.txt >/tmp/v22-protected.sha256
      - name: Apply fullscreen visibility portal and present-day balance column
        run: |
          set -euo pipefail
          python member-tree-v22-visual/history_popup_portal_fix_patch.py
          python member-tree-v22-visual/history_popup_current_balance_patch.py
          sha256sum --check /tmp/v22-protected.sha256
          node --check member-tree/static/app.js
      - name: Test portal restore, actual balance/withdrawal values and 3 numeric sorts
        run: |
          node member-tree-v22-visual/test_history_popup_maximized.cjs
          node member-tree-v22-visual/test_single_red_ring_sortable_list.cjs
          node member-tree-v22-visual/test_compact_withdraw_list_soft_rings.cjs
          node member-tree-v22-visual/test_history_popup_visible_scrollbar.cjs
          node member-tree-v22-visual/test_weekly_monthly_ui.cjs
          node member-tree-v22-visual/test_history_ui.cjs
          node member-tree-v22-visual/test_team_growth_percentage.cjs
          node member-tree-v22-visual/test_ranking_all_columns_sort.cjs
      - name: Install temporary SQLite regression dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Assert recorded withdrawals and cash balances stay untouched
        run: |
          python member-tree-v22-visual/test_weekly_monthly_api.py
          python member-tree-v22-visual/test_history_api.py
