name: Inspect V34 AI knowledge integration anchors
on:
  push:
    branches: [member-tree-v34-ai-knowledge-hub]
    paths: [.github/workflows/v34-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('member-tree/app.py')
          p=f.read_text().splitlines()
          print('PY_LINES',len(p))
          for a,b in [(28,58),(125,169),(250,344),(332,365),(465,502),(560,590)]:
            print('--- PY',a,b)
            for i in range(a-1,min(b,len(p))):
              line=p[i]
              if any(t in line.lower() for t in ('password','secret','token','admin_users_json')):print(i+1,'[credential-related source redacted]')
              else:print(i+1,line[:850])
          j=Path('member-tree/static/app.js').read_text().splitlines()
          for a,b in [(1,44),(68,110),(1100,1153)]:
            print('--- JS',a,b)
            for i in range(a-1,min(b,len(j))):
              line=j[i]
              if 'password' in line.lower() or 'secret' in line.lower():print(i+1,'[credential UI omitted]')
              else:print(i+1,line[:1300])
          h=Path('member-tree/static/index.html').read_text().splitlines()
          print('HTML view navigation line',h[2][:3600])
          print('REQUIREMENTS',Path('member-tree/requirements.txt').read_text())
          PY
