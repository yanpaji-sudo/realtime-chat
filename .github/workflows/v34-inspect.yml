name: Inspect V34 AI knowledge integration anchors
on:
  push:
    branches: [member-tree-v34-ai-knowledge-hub]
    paths: [.github/workflows/v34-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          import re
          f=Path('member-tree/app.py')
          p=f.read_text().splitlines()
          print('PY_LINES',len(p))
          import re
          for label,lines,needles in [
           ('JS',Path('member-tree/static/app.js').read_text().splitlines(),
            ['async function api','function api','function mk','function configure','function setRole','function render(){','function refresh(','function showToast','function message']),
           ('PY',p,['class ','def require(','def db_init(','def db_init','def utc_now','def audit','def static('])]:
            for needle in needles:
             for i,line in enumerate(lines):
              if needle in line:
               print('ANCHOR',label,needle,'LINE',i+1)
               for k in range(max(0,i-3),min(len(lines),i+12)):
                v=lines[k]
                if any(s in v.lower() for s in ('password','secret','token','admin_users_json')):v='[redacted]'
                print(f'{k+1} {v[:1100]}')
               break
          print('requirements:',Path('member-tree/requirements.txt').read_text()[:2500])
          PY
