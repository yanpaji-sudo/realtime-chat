name: Inspect V34 form upload and API headers
on:
  push:
    branches: [member-tree-v34-ai-knowledge-hub]
    paths: [.github/workflows/v34-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          s=Path('member-tree/static/app.js').read_text().splitlines()
          for a,b in [(180,206),(1148,1153)]:
           for i in range(a-1,b):
            print(i+1,s[i].replace('csrf','csrf_value'))
          PY
