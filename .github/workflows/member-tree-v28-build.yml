name: Build and test V28 compact tree safe release
on:
  push:
    branches: [member-tree-v28-compact-view]
    paths:
      - '.github/workflows/member-tree-v28-build.yml'
      - 'member-tree-v28/patch.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch isolated exact V27 bundle and compile
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v28/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install regression dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Verify V28 compact and prior risk, glow, backup and stake behavior
        run: |
          cd member-tree
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Pack tested frontend-only V28 and push isolated branch
        run: |
          tar -czf /tmp/member-tree-v28.tgz member-tree
          base64 -w0 /tmp/member-tree-v28.tgz > member-tree-deploy/payload.b64
          git config user.name "V28 Tested Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V28: compact tree and hover detail full team dashboard"
          git push origin HEAD:member-tree-v28-compact-view
