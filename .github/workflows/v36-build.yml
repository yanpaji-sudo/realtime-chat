name: Verify V36 low-cost model and preserve V35 member system
on:
  push:
    branches: [member-tree-v36-economy-model]
    paths:
      - 'member-tree-v36/economy_patch.py'
      - 'member-tree-v36/test_v36_economy.py'
      - '.github/workflows/v36-build.yml'
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract production V35 and apply only independent AI request patch
        run: |
          git fetch --no-tags origin member-tree-render
          test "$(git rev-parse FETCH_HEAD)" = "ca1fc75f1f176426c2a3e62d96cdf3ccd743aaaa"
          git show FETCH_HEAD:member-tree-deploy/payload.b64 | base64 -d | tar xz
          python3 member-tree-v36/economy_patch.py
          cp member-tree-v36/test_v36_economy.py member-tree/tests/test_v36_economy.py
          python3 -m py_compile member-tree/academy.py member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install test packages
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Regression tests for AI, archive, and existing member tree
        run: |
          cd member-tree
          python3 -m pytest -q tests/test_v36_economy.py tests/test_v35_tutor.py tests/test_v34_academy.py
          node tests/test_v35_frontend.cjs
          node tests/test_v34_academy.cjs
          node tests/test_v33_rank_alert.cjs
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v31_stake_threshold.cjs
          node tests/test_v30_balance.cjs
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v33_alert_state.py tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Publish tested V36 payload to feature branch only
        run: |
          tar -czf /tmp/member-tree-v36.tgz member-tree
          base64 -w0 /tmp/member-tree-v36.tgz > member-tree-deploy/payload.b64
          git config user.name "V36 Economy CI"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V36: support gpt-6-luna and optimized knowledge tutor requests"
          git push origin HEAD:member-tree-v36-economy-model
