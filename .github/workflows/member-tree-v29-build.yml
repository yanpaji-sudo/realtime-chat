name: Validate and bundle V29 without touching production data
on:
  push:
    branches: [member-tree-v29-position-risk-tooltip]
    paths: ['member-tree-v29/patch.py', '.github/workflows/member-tree-v29-build.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V29 to isolated V28 package and syntax check
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v29/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install test dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Test V29 plus historical features and data safety
        run: |
          cd member-tree
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Package tested V29 for original branch deployment
        run: |
          tar -czf /tmp/member-tree-v29.tgz member-tree
          base64 -w0 /tmp/member-tree-v29.tgz > member-tree-deploy/payload.b64
          git config user.name "V29 Tested Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V29: position warnings and streamlined team hover metrics"
          git push origin HEAD:member-tree-v29-position-risk-tooltip
