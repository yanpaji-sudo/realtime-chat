name: Build and test independent Whale V28 demo
on:
  push:
    branches: [member-tree-jingyu-isolated-1000]
    paths: ['member-tree-jingyu/patch.py', '.github/workflows/jingyu-build.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated V28 replica from pinned production-code bundle only
        run: |
          git fetch --no-tags origin member-tree-render
          test "$(git rev-parse FETCH_HEAD)" = "e1209075e147e1d927e6e70f25d074ac84e4c039"
          git show FETCH_HEAD:member-tree-deploy/payload.b64 | base64 -d | tar xz
          find member-tree -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -delete
          python3 member-tree-jingyu/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install test dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Test isolation, freshly randomized 1000 members, V28 and legacy features
        run: |
          cd member-tree
          rm -f /tmp/jingyu_isolated_member_tree_v28_1000.sqlite3
          JINGYU_AUTOFILL=0 python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py
          rm -f /tmp/jingyu_isolated_member_tree_v28_1000.sqlite3
          python3 -m pytest -q tests/test_jingyu_isolation.py
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          grep -q '鲸鱼小组数据报表' static/app.js
      - name: Pack tested copy for separate Render service
        run: |
          tar -czf /tmp/jingyu-isolated.tgz member-tree
          base64 -w0 /tmp/jingyu-isolated.tgz > member-tree-deploy/payload.b64
          git config user.name "Jingyu Test Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "Whale isolated V28 compact test: refresh 1000 randomized members"
          git push origin HEAD:member-tree-jingyu-isolated-1000
