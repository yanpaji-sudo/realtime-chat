name: Inspect V22 account and remark filtering sources
on:
  push:
    branches: [member-tree-render]
    paths: ['.github/workflows/v22-remark-search-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python - <<'PY'
          import re
          s=open('member-tree/static/app.js',encoding='utf-8').read()
          for pat in [r'function getShown\(',r'function tableData\(',r'function renderTableView\(',r'function renderTable\(',r'function renderRanking\(',r'\.includes\(query\.toLowerCase\(\)\)',r'query\.toLowerCase\(\)',r'\bquery\b.+includes',r'query\.length']:
           hits=list(re.finditer(pat,s))
           print('=====',pat,'HITS',len(hits))
           for m in hits[:8]:
            a=max(0,m.start()-170);b=min(len(s),m.end()+1200)
            print('OFFSET',m.start(),s[a:b])
          PY
