name: Publish V22 historical signup and daily withdrawal calendar
on:
  push:
    branches: [member-tree-render]
    paths:
      - '.github/workflows/v22-history-withdraw-formal.yml'
permissions:
  contents: write
concurrency:
  group: v22-historical-calendar-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact current V22 source archive before changing anything
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:member-tree-deploy/payload.b64)" = "8b10bf6d816063b4cf45a6d357df61c49de74d3a"
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/academy.py > /tmp/v22-original-academy.sha256
      - name: Add read-only historical withdrawals and stronger neon calendar highlights
        run: |
          set -euo pipefail
          python3 member-tree-v22-visual/history_withdraw_api_patch.py
          python3 member-tree-v22-visual/history_calendar_ui_patch.py
          sha256sum --check /tmp/v22-original-academy.sha256
          python3 -m py_compile member-tree/app.py member-tree/academy.py
          node --check member-tree/static/app.js
          node member-tree-v22-visual/test_history_ui.cjs
      - name: Install isolated regression test dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Verify yesterday ledger queries are read-only and never use today's amounts
        run: python member-tree-v22-visual/test_history_api.py
      - name: Verify existing V22 full-screen / compact / red rings are retained
        run: |
          set -euo pipefail
          cd member-tree
          for t in tests/test_v32_fullscreen_hover.cjs tests/test_v27_red_withdrawal_ui.cjs tests/test_v28_compact.cjs; do
            if [ -f "$t" ]; then node "$t"; fi
          done
      - name: Publish only the packaged code; keep live Postgres volume and data
        run: |
          set -euo pipefail
          tar -czf /tmp/v22-historical-calendar.tgz member-tree
          base64 -w0 /tmp/v22-historical-calendar.tgz > member-tree-deploy/payload.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member-tree-deploy/payload.b64
          if ! git diff --cached --quiet; then
            git commit -m 'V22: historical join-date neon and read-only daily withdrawal red rings'
            git push origin HEAD:member-tree-render
          fi
