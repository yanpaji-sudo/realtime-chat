name: Verify final V29 with unlimited month quota
on:
  push:
    branches: [member-tree-v29-position-risk-tooltip]
    paths: ['member-tree-v29/fix_full_months.py', '.github/workflows/member-tree-v29-final.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch isolated tested V29 bundle and compile
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v29/fix_full_months.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install regression test dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Run all V29 and prior UI and data regressions
        run: |
          cd member-tree
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Commit tested V29 full-month bundle
        run: |
          tar -czf /tmp/member-tree-v29-final.tgz member-tree
          base64 -w0 /tmp/member-tree-v29-final.tgz > member-tree-deploy/payload.b64
          git config user.name "V29 Final Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V29 fix: team referral goal counts full months beyond six"
          git push origin HEAD:member-tree-v29-position-risk-tooltip
