name: Read-only check deployed DFX 05 and 09 selectors
on:
  push:
    branches: [dfx-add-groups-05-09-v2]
    paths: ['.github/workflows/dfx-groups-v2-live.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check website and new group selectors (no writes)
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base='https://dfx-member-tree-test.onrender.com'
          def get(path):
            req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'DFX-groups-v2-read-only'})
            with urllib.request.urlopen(req,timeout=100) as r:
              assert r.status==200
              return r.read(500000).decode('utf-8')
          assert json.loads(get('/api/health'))['status']=='ok'
          status=json.loads(get('/api/dfx-status'))
          assert status['site']=='DFX数据图'
          assert status['admin_count']==10
          assert status['storage_persistent'] is False
          html=get('/')
          js=get('/static/app.js')
          assert 'DFX数据图' in html
          assert '10位管理员独立登录' in html
          assert 'value="05">05小组</option>' in html
          assert 'value="09">09小组</option>' in html
          assert "const TREE_GROUPS=['01','02','03','05','06','08','09'];" in js
          assert "['05','05组：本月逐日']" in js and "['09','09组：本月逐日']" in js
          assert '总存款' in js
          print('DFX_V2_LIVE_PASS: original link, 7 team groups, new 05/09, ten-admin interface, ephemeral storage')
          PY