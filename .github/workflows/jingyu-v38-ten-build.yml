name: Build and verify Whale V38 10-member isolated upgrade
on:
  push:
    branches: [jingyu-v38-tenmembers-20261109]
    paths:
      - 'jingyu-v38-ten/patch.py'
      - '.github/workflows/jingyu-v38-ten-build.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unpack exact tested production V38 code to disposable CI workspace
        run: |
          set -euo pipefail
          git fetch --no-tags origin member-tree-render
          test "$(git rev-parse FETCH_HEAD)" = "95f26538813f05dff43ac589591095bb9a529b7d"
          git show FETCH_HEAD:member-tree-deploy/payload.b64 | base64 -d | tar xz
          test -f member-tree/app.py
          find member-tree -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -delete
          python3 jingyu-v38-ten/patch.py
          python3 -m py_compile member-tree/app.py member-tree/academy.py
          node --check member-tree/static/app.js
          grep -q "jingyu_v38_only_ten.sqlite3" member-tree/app.py
          grep -q 'production_database_connected' member-tree/app.py
          grep -q '鲸鱼小组' member-tree/static/index.html
          grep -q '严格课程模式' member-tree/static/app.js
      - name: Install test dependencies
        run: python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Test ten-member synthetic data, login separation and every original tree feature
        run: |
          set -euo pipefail
          cd member-tree
          rm -f /tmp/jingyu_v38_only_ten.sqlite3*
          python3 -m pytest -q tests/test_jingyu_ten.py tests/test_v34_academy.py tests/test_v36_economy.py tests/test_v38_strict.py
          node tests/test_v35_frontend.cjs
          node tests/test_v34_academy.cjs
          node tests/test_v33_rank_alert.cjs
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v31_stake_threshold.cjs
          node tests/test_v30_balance.cjs
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v33_alert_state.py tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Package tested artifact on feature branch only
        run: |
          set -euo pipefail
          tar -czf /tmp/jingyu-v38-ten.tgz member-tree
          base64 -w0 /tmp/jingyu-v38-ten.tgz > member-tree-deploy/payload.b64
          git config user.name "Whale V38 Test CI"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "Whale V38: clean isolated ten-member test release with AI Academy"
          git push origin HEAD:jingyu-v38-tenmembers-20261109
      - name: Staging remains independent from Render
        run: echo "Package validated on feature branch; Render original whale branch untouched."
