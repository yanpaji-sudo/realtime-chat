name: Test V22 fullscreen historical scroll fixes (NO DEPLOY)
on:
  push:
    branches: [v22-max-popup-visible-scrollbar-dev-20261125]
    paths:
      - '.github/workflows/v22-visible-scrollbar-dev.yml'
      - 'member-tree-v22-visual/history_popup_visible_scrollbar_patch.py'
      - 'member-tree-v22-visual/test_history_popup_visible_scrollbar.cjs'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current V22 app in isolated CI, protect member finance
        run: |
          set -euo pipefail
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/app.py member-tree/academy.py member-tree/requirements.txt > /tmp/unchanged-v22.sha256
          python member-tree-v22-visual/history_popup_visible_scrollbar_patch.py
          sha256sum --check /tmp/unchanged-v22.sha256
          node --check member-tree/static/app.js
      - name: Test fixed-height table and visible scrollbar, restore and sort
        run: |
          node member-tree-v22-visual/test_history_popup_visible_scrollbar.cjs
          node member-tree-v22-visual/test_history_popup_maximized.cjs
          node member-tree-v22-visual/test_single_red_ring_sortable_list.cjs
          node member-tree-v22-visual/test_history_ui.cjs
      - name: Install temporary SQLite-only test dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Confirm no regression to historical withdrawal amounts
        run: |
          python member-tree-v22-visual/test_history_api.py
          python member-tree-v22-visual/test_weekly_monthly_api.py
