name: Test formal team PNG and Excel exports safely
on:
  push:
    branches: [member-tree-team-export-v1]
    paths:
      - 'member-tree-team-export/**'
      - '.github/workflows/member-tree-team-export-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned formal version and extract safely
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:member-tree-deploy/payload.b64)" = "444782980bdc2d76de0876c9f7af2625c9ac1390"
          base64 -d member-tree-deploy/payload.b64 | tar xz
          test -f member-tree/app.py
          test -f member-tree/static/app.js
          find member-tree -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -delete
      - name: Apply export patch and compile
        run: |
          set -euo pipefail
          python3 member-tree-team-export/patch.py
          cp member-tree-team-export/test_export.py member-tree/tests/test_team_export_formal.py
          python3 -m py_compile member-tree/app.py member-tree/tests/test_team_export_formal.py
          node --check member-tree/static/app.js
          grep -q "function teamOnlyShow(id)" member-tree/static/app.js
          grep -q "团队数据汇总" member-tree/app.py
      - name: Install dependencies
        run: python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Tests for workbook, styling and original functions
        run: |
          set -euo pipefail
          cd member-tree
          python3 -m pytest -q tests/test_team_export_formal.py
          python3 -m pytest -q tests/test_layer_export.py tests/test_no_data_modification.py
          node tests/test_v28_compact.cjs
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v33_rank_alert.cjs
      - name: Archive tested source and update candidate payload only
        run: |
          set -euo pipefail
          tar -czf /tmp/member-tree-team-export.tgz member-tree
          base64 -w0 /tmp/member-tree-team-export.tgz > member-tree-deploy/payload.b64
          git config user.name 'Formal Team Export CI'
          git config user.email 'actions@users.noreply.github.com'
          git add member-tree-deploy/payload.b64
          git commit -m 'Tested team-only tree PNG and joined-date Excel export'
          git push origin HEAD:member-tree-team-export-v1
