name: V30 verified own-balance hover fix
on:
  push:
    branches: [member-tree-v30-own-balance-tooltip]
    paths: ['member-tree-v30/patch.py','.github/workflows/member-tree-v30-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal V30 to isolated V29 bundle
        run: |
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 member-tree-v30/patch.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
      - name: Install regression test dependencies
        run: |
          python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Run new balance rule and V29/V28/V27 plus backup tests
        run: |
          cd member-tree
          node tests/test_v30_balance.cjs
          node tests/test_v29_position_alert.cjs
          node tests/test_v28_compact.cjs
          node tests/test_v27_red_withdrawal_ui.cjs
          node tests/test_v24_palette_risk.cjs
          node tests/test_v23_compact_ai.cjs
          python3 -m pytest -q tests/test_v26_duplicate_reconcile.py tests/test_v25_all_level_stake.py tests/test_v11_backup.py
      - name: Package tested patch without touching data
        run: |
          tar -czf /tmp/member-tree-v30.tgz member-tree
          base64 -w0 /tmp/member-tree-v30.tgz > member-tree-deploy/payload.b64
          git config user.name "V30 Verified Build"
          git config user.email "actions@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          git commit -m "V30: show member own balance with per-direct red/green thresholds"
          git push origin HEAD:member-tree-v30-own-balance-tooltip
