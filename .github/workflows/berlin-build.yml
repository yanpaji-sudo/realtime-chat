name: Build Berlin paid production release
on:
  push:
    branches:
      - berlin-member-tree-test-20261119
    paths:
      - member-tree-deploy/berlin_patch.py
      - member-tree-deploy/berlin_daily_recharge_patch.py
      - member-tree-deploy/berlin_three_line_cashflow_patch.py
      - member-tree-deploy/berlin_reverse_cashflow_patch.py
      - member-tree-deploy/test_berlin_three_line_cashflow.py
      - member-tree-deploy/berlin_six_column_dedupe_patch.py
      - member-tree-deploy/test_berlin_six_column_dedupe.py
      - member-tree-deploy/berlin_full_replace_import_patch.py
      - member-tree-deploy/berlin_bulk_new_members_patch.py
      - member-tree-deploy/berlin_bulk_latest_wins_patch.py
      - member-tree-deploy/berlin_visual_tour_density_patch.py
      - member-tree-deploy/berlin_visual_repaint_patch.py
      - member-tree-deploy/berlin_single_member_upsert_patch.py
      - member-tree-deploy/berlin_case_insensitive_member_patch.py
      - member-tree-deploy/berlin_zero_stake_patch.py
      - member-tree-deploy/berlin_manual_recharge_reconcile_patch.py
      - member-tree-deploy/berlin_balance_blank_column_patch.py
      - member-tree-deploy/berlin_bidirectional_finance_patch.py
      - member-tree-deploy/berlin_history_join_calendar_patch.py
      - member-tree-deploy/berlin_history_neon_visibility_patch.py
      - member-tree-deploy/berlin_v22_rosters_sync_patch.py
      - member-tree-deploy/test_berlin_v22_rosters_sync.cjs
      - member-tree-v22-visual/team_growth_percentage_patch.py
      - member-tree-v22-visual/ranking_all_columns_sort_patch.py
      - member-tree-v22-visual/test_team_growth_percentage.cjs
      - member-tree-v22-visual/test_ranking_all_columns_sort.cjs
      - member-tree-deploy/test_berlin_history_neon_visibility.py
      - member-tree-deploy/test_berlin_history_calendar.py
      - member-tree-deploy/test_berlin_bidirectional_finance.py
      - member-tree-deploy/test_berlin_balance_blank_column.py
      - member-tree-deploy/test_berlin_manual_recharge_reconcile.py
      - member-tree-deploy/test_berlin_single_member_upsert.py
      - member-tree-deploy/test_berlin_bulk_new_members.py
      - .github/workflows/berlin-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-berlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Load original formal-release archive
        run: |
          git fetch origin 2aaeeac32ce8d579bee4a8ec5370952dd246c11d
          git show 2aaeeac32ce8d579bee4a8ec5370952dd246c11d:member-tree-deploy/payload.b64 > /tmp/berlin_formal.b64
      - name: Build patched Berlin payload
        run: |
          python member-tree-deploy/berlin_patch.py
          python - <<'PY'
          import base64,gzip,tarfile,io
          p=open('member-tree-deploy/payload.b64','rb').read()
          archive=gzip.decompress(base64.b64decode(p))
          with tarfile.open(fileobj=io.BytesIO(archive)) as t:
              f=t.extractfile('member-tree/app.py').read().decode()
              assert 'member_registration_times' in f
              assert 'berlin_6_columns' in f
              assert '柏林六列全量覆盖' in f
              assert "UPDATE members SET deleted=1" in f
              assert 'berlin_incremental_6_columns' not in f
              assert '确认追加会员数据' not in f
              assert 'def berlin_recharge_preview' in f
              assert 'def berlin_recharge_confirm' in f
              assert 'CREATE TABLE IF NOT EXISTS berlin_daily_recharge' in f
              assert 'def berlin_recharge_supplement' in f
              assert 'def berlin_three_line_cashflow' in f
              assert "berlin_three_line_cashflow(lines,'recharge')" in f
              assert "berlin_three_line_cashflow(lines,'daily')" in f
              assert 'if reverse_line or reverse_pair:' in f
              assert '第{line_no}行金额后缺少会员账号' in f
          print('Berlin payload verified')
          PY
      - name: Install application dependencies for isolated financial tests
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Regression test duplicate account imports
        run: python member-tree-deploy/test_berlin_six_column_dedupe.py
      - name: Regression test three-line finance uploads
        run: python member-tree-deploy/test_berlin_three_line_cashflow.py
      - name: Test today's member six-field full Excel incremental import
        run: python member-tree-deploy/test_berlin_bulk_new_members.py
      - name: Regression test single account create-or-overwrite via plus button
        run: python member-tree-deploy/test_berlin_single_member_upsert.py
      - name: Test manual join-day nightly recharge overwrite and zero-stake addition
        run: python member-tree-deploy/test_berlin_manual_recharge_reconcile.py
      - name: Test balance account blank-column amount for TSV and Excel
        run: python member-tree-deploy/test_berlin_balance_blank_column.py
      - name: Test balance, recharge, withdrawal both account/amount orders
        run: python member-tree-deploy/test_berlin_bidirectional_finance.py
      - name: Test historical daily newcomer calendar and colored rings
        run: python member-tree-deploy/test_berlin_history_calendar.py
      - name: Test neon history highlight remains visible at minimum zoom
        run: python member-tree-deploy/test_berlin_history_neon_visibility.py
      - name: Test second-level team growth and all-column click-to-sort for 4 periods
        run: |
          set -euo pipefail
          node --check member-tree/static/app.js
          node member-tree-v22-visual/test_team_growth_percentage.cjs
          node member-tree-v22-visual/test_ranking_all_columns_sort.cjs
      - name: Test synchronized V22 review rosters without database changes
        run: |
          set -euo pipefail
          node --check member-tree/static/app.js
          node member-tree-deploy/test_berlin_v22_rosters_sync.cjs
      - name: Commit test-only release archive
        run: |
          git config user.name "berlin-release-bot"
          git config user.email "berlin-release-bot@users.noreply.github.com"
          git add member-tree-deploy/payload.b64
          if ! git diff --staged --quiet; then
            git commit -m "Publish Berlin tree test from formal release with six-column importer"
            git push origin HEAD:berlin-member-tree-test-20261119
          fi
