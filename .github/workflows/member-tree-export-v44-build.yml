name: Build and test formal V44 Excel member columns and yellow balance
on:
  push:
    branches: [member-tree-export-extra-v44]
    paths:
      - 'member-tree-team-export/**'
      - '.github/workflows/member-tree-export-v44-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Start from immutable production base without accessing live database
        run: |
          set -euo pipefail
          git fetch --no-tags origin 95f26538813f05dff43ac589591095bb9a529b7d
          test "$(git rev-parse FETCH_HEAD:member-tree-deploy/payload.b64)" = "444782980bdc2d76de0876c9f7af2625c9ac1390"
          git show FETCH_HEAD:member-tree-deploy/payload.b64 | base64 -d | tar xz
          test -f member-tree/app.py
          find member-tree -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) -delete
      - name: Apply only read-only team export patch
        run: |
          python3 member-tree-team-export/patch.py
          cp member-tree-team-export/test_export.py member-tree/tests/test_team_export_formal.py
          python3 -m py_compile member-tree/app.py
          node --check member-tree/static/app.js
          grep -q "v33_position_limits" member-tree/app.py
      - name: Install test dependencies
        run: python3 -m pip install -r member-tree/requirements.txt pytest httpx
      - name: Verify name, direct referrals, per-member warning levels, colors and regressions
        run: |
          set -euo pipefail
          cd member-tree
          python3 -m pytest -q tests/test_team_export_formal.py tests/test_layer_export.py tests/test_no_data_modification.py tests/test_v33_alert_state.py
          node tests/test_v28_compact.cjs
          node tests/test_v32_fullscreen_hover.cjs
          node tests/test_v33_rank_alert.cjs
      - name: Package for isolated code-only production release
        run: |
          set -euo pipefail
          find member-tree -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) -delete
          tar -czf /tmp/member-tree-v44.tgz member-tree
          base64 -w0 /tmp/member-tree-v44.tgz > member-tree-deploy/payload.b64
          git config user.name 'Formal Excel Export CI'
          git config user.email 'actions@users.noreply.github.com'
          git add member-tree-deploy/payload.b64
          git commit -m 'Tested V44 Excel name, direct referrals and yellow balance warnings'
          git push origin HEAD:member-tree-export-extra-v44
