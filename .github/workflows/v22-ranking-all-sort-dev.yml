name: Test V22 all team ranking column sorting (NO DEPLOY)
on:
  push:
    branches: [v22-ranking-all-columns-sort-dev-20261125]
    paths:
      - '.github/workflows/v22-ranking-all-sort-dev.yml'
      - 'member-tree-v22-visual/ranking_all_columns_sort_patch.py'
      - 'member-tree-v22-visual/test_ranking_all_columns_sort.cjs'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack current V22 application in isolated CI
        run: |
          set -euo pipefail
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/app.py member-tree/academy.py member-tree/requirements.txt >/tmp/v22-finance-unchanged.sha256
          python member-tree-v22-visual/ranking_all_columns_sort_patch.py
          sha256sum --check /tmp/v22-finance-unchanged.sha256
          node --check member-tree/static/app.js
      - name: Verify every column descending/ascending, finance sorting, keyboard and details
        run: |
          node member-tree-v22-visual/test_ranking_all_columns_sort.cjs
          node member-tree-v22-visual/test_team_growth_percentage.cjs
      - name: Verify original scrollbar and weekly/monthly history visual UI
        run: |
          node member-tree-v22-visual/test_history_popup_visible_scrollbar.cjs
          node member-tree-v22-visual/test_history_popup_maximized.cjs
          node member-tree-v22-visual/test_single_red_ring_sortable_list.cjs
          node member-tree-v22-visual/test_weekly_monthly_ui.cjs
      - name: Install SQLite-only regression dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Verify money and member history unchanged
        run: |
          python member-tree-v22-visual/test_history_api.py
          python member-tree-v22-visual/test_weekly_monthly_api.py
