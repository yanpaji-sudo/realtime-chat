name: Publish V22 one red withdrawal ring and sortable history
on:
  push:
    branches: [member-tree-render]
    paths: ['.github/workflows/v22-one-red-ring-sort-formal.yml']
permissions:
  contents: write
concurrency:
  group: v22-one-red-ring-sort-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact V22 current production archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:member-tree-deploy/payload.b64)" = "334d3779a224e588ed2919a2d0f8a4e77f223734"
          base64 -d member-tree-deploy/payload.b64 | tar xz
          sha256sum member-tree/app.py member-tree/academy.py member-tree/requirements.txt > /tmp/v22-finance-unchanged.sha256
      - name: Replace triple history rings with one and add sortable total/count
        run: |
          set -euo pipefail
          python member-tree-v22-visual/single_red_ring_sortable_list_patch.py
          sha256sum --check /tmp/v22-finance-unchanged.sha256
          node --check member-tree/static/app.js
          node member-tree-v22-visual/test_single_red_ring_sortable_list.cjs
          node member-tree-v22-visual/test_compact_withdraw_list_soft_rings.cjs
          node member-tree-v22-visual/test_weekly_monthly_ui.cjs
          node member-tree-v22-visual/test_history_ui.cjs
      - name: Install isolated regression dependencies
        run: python -m pip install -r member-tree/requirements.txt httpx2
      - name: Confirm original historical finances are not rewritten
        run: |
          python member-tree-v22-visual/test_weekly_monthly_api.py
          python member-tree-v22-visual/test_history_api.py
      - name: Preserve legacy daily red withdrawal ring and fullscreen behavior
        run: |
          set -euo pipefail
          cd member-tree
          for t in tests/test_v32_fullscreen_hover.cjs tests/test_v27_red_withdrawal_ui.cjs tests/test_v28_compact.cjs; do
            if [ -f "$t" ]; then node "$t"; fi
          done
      - name: Rebuild V22 app artifact without modifying PostgreSQL
        run: |
          set -euo pipefail
          tar -czf /tmp/v22-one-red-ring-sort.tgz member-tree
          base64 -w0 /tmp/v22-one-red-ring-sort.tgz > member-tree-deploy/payload.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add member-tree-deploy/payload.b64
          if ! git diff --cached --quiet; then
            git commit -m 'V22: one clean red history ring and sortable amount/count list'
            git push origin HEAD:member-tree-render
          fi
