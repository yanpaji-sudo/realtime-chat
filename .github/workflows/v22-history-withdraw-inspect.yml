name: Inspect V22 daily-withdrawal history and join date schema (NO DEPLOY)
on:
  push:
    branches: [v22-history-withdraw-calendar-dev-20261125]
    paths:
      - '.github/workflows/v22-history-withdraw-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only source extraction and history diagnostics
        run: |
          set -euo pipefail
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          p=Path('member-tree/app.py').read_text()
          j=Path('member-tree/static/app.js').read_text()
          h=Path('member-tree/static/index.html').read_text()
          print('===BACKEND MODELS/TABLES===',flush=True)
          for x in p.splitlines():
              if any(t in x.lower() for t in ('create table','withdraw_history','daily_withdraw','archive','report_snap','history','daily_ledger','snapshot','date_from','settle_past_days','def db_init','def active_rows')):
                  if any(t in x.lower() for t in ('create table','withdraw_history','archive','report_snap','daily_ledger','snapshot','history','def db_init','def active_rows','def settle_past_days')):
                      print(x[:260],flush=True)
          print('===BACKEND FUNCTIONS===',flush=True)
          for needle in ['def db_init(', 'def active_rows(', 'def settle_past_days(', 'def capture_current_report(', 'def report_window(', 'def current_day(', 'def get_tree(', '@app.get(\'/api/tree', '@app.get(\'/api/report', '@app.post(\'/api/import/', 'daily_withdraw_cents', 'SELECT * FROM daily', 'CREATE TABLE IF NOT EXISTS history']:
              pos=p.find(needle)
              print('MARKER',needle,pos,flush=True)
              if pos>=0:print(p[max(0,pos-150):pos+6800],flush=True)
          print('===UI SNIPPETS===',flush=True)
          for needle in ['function renderBranch(){','function draw(){','const highlight=branchSelectedAccount','for(const m of shownRows){','function nodeCard(', 'function renderTree(', 'function render(){','let v22VisionMode=', 'function startDensity()', 'function apply(){','branchViewportControls=', 'function updateOverviewReport(']:
              pos=j.find(needle)
              print('UI',needle,pos,flush=True)
              if pos>=0:print(j[max(0,pos-150):pos+(8500 if needle=='function renderBranch(){' else 3700)],flush=True)
          print('===HTML existing markers===',flush=True)
          for needle in ['branch-canvas','member-top','</body>','withdraw-red-outer','history']:
              print(needle,h.find(needle),flush=True)
          PY
