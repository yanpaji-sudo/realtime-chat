name: Inspect production member-tree UI/export integration safely
on:
  push:
    branches: [member-tree-team-export-v1]
    paths: ['.github/workflows/member-tree-team-export-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled source only, no database access
        run: |
          set -euo pipefail
          base64 -d member-tree-deploy/payload.b64 | tar xz
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('member-tree')
          for p in [root/'app.py',root/'static/app.js',root/'static/index.html',root/'static/style.css']:
              print('FILE',str(p),'bytes',p.stat().st_size,flush=True)
          print('PYFILES',[(p.name,p.stat().st_size) for p in root.glob('*.py')],flush=True)
          print('TESTS',[p.name for p in (root/'tests').glob('*')][:60],flush=True)
          js=(root/'static/app.js').read_text(encoding='utf-8').splitlines()
          html=(root/'static/index.html').read_text(encoding='utf-8').splitlines()
          py=(root/'app.py').read_text(encoding='utf-8').splitlines()
          print('JS_FUNCTIONS',[(i+1,line[:220]) for i,line in enumerate(js) if re.search(r'(function .*?(export|detail|modal|tree|render|branch|member|csv|excel|download|capture|summary)|个人与团队数据|团队指标|团队架构|导出|加入日期|joined_on)',line,re.I)][:125],flush=True)
          print('HTML_MATCHES',[(i+1,line[:350]) for i,line in enumerate(html) if any(x in line for x in ['详情','会员','modal','导出','script','个人与团队','团队'])][:90],flush=True)
          print('BACKEND_ROUTES',[(i+1,line[:250]) for i,line in enumerate(py) if re.search(r'@app\.(get|post|put|delete)|DATABASE_URL|sqlite|def team|def export|class Member',line,re.I) and not re.search(r'(password|secret|token|api_key|credential)',line,re.I)][:100],flush=True)
          for key in ['个人与团队数据','团队指标','团队风险','团队总人数','下级平均余额','function openDetail','function showDetail','function showMember','function export','function renderBranch','function renderTree','function openEdit','function renderMember','joined_on','exportMembers','下载']:
              inds=[i for i,line in enumerate(js) if key in line][:4]
              for i in inds:
                  print('JS_CONTEXT',key,'LINE',i+1,flush=True)
                  for n in range(max(0,i-5),min(len(js),i+16)):
                      print('J',n+1,js[n][:350],flush=True)
          print('CSS_HITS',[(i+1,line[:180]) for i,line in enumerate((root/'static/style.css').read_text(encoding='utf-8').splitlines()) if any(x in line for x in ['member-detail','member-modal','detail-modal','modal-title','detail-title','v29-','detail-card'])][:100],flush=True)
          PY